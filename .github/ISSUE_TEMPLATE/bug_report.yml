name: Bug report
description: Something is wrong in the game, in Setup or in the launcher.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Never attach or link game files, keys, firmware, saves with personal data, or a built game folder: such issues are closed and the attachment deleted.
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Setup (install or update)
        - Start-up (before the title screen)
        - In game
        - Settings (F10) / controls
        - Launcher (before the game starts)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
      description: Steps to see it, where in the game, and how often. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: System info
      description: In the game, press F10 and then **Copy system info** at the bottom of the window, and paste it here. It holds the version, Windows, CPU, GPU and driver, display and the settings you changed (no user name, no paths). If the game does not get that far, write your CPU, GPU and driver version, RAM and Windows version instead.
      render: text
      placeholder: "Release v0.1.x, commit ...\nWindows 11 ...\nCPU: ...\nGPU: ... (driver ...)\n..."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Attach the game's log: open `%LOCALAPPDATA%\nxrecomp\TotK-engine\logs` (paste it in Explorer's address bar) and drag the newest `totk-*.log` here. After a crash, also attach the newest `crash-*.txt` from the `crashes` folder next to it. Never attach the `.dmp` file next to it: it holds the game's memory; the `.txt` is enough. When an error box offers to open the log, that is the same file. For Setup: `setup.log` in your install folder. The logs hold no keys; the paths in them can show your Windows user name.
  - type: input
    id: version
    attributes:
      label: Version
      description: Only if the system info above is missing (the first lines of README.txt in the game's folder show it).
